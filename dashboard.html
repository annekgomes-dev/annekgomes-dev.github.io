<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard da Campanha</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Segoe UI, Arial;
background:#f4f6fa;
margin:0;
padding:40px;
}

.container{
max-width:900px;
margin:auto;
}

.card{
background:#fff;
padding:30px;
border-radius:10px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
margin-bottom:30px;
}

h1{
text-align:center;
color:#0b3d91;
}

.metric{
font-size:40px;
text-align:center;
color:#b71c1c;
font-weight:bold;
}

canvas{
margin-top:20px;
}

.footer{
text-align:center;
margin-top:30px;
color:#666;
}

</style>

</head>

<body>

<div class="container">

<h1>📊 Dashboard da Campanha LGPD</h1>

<div class="card">

<h2>Total de acessos ao link</h2>

<div class="metric" id="contador">0</div>

</div>

<div class="card">

<h2>Taxa de risco da campanha</h2>

<canvas id="grafico"></canvas>

</div>

<div class="footer">
Campanha de Conscientização | Segurança da Informação | Flex
</div>

</div>

<script>

/* pegar contador salvo */

let cliques = localStorage.getItem("cliquesCampanha");

if(!cliques){
cliques = 0;
}

document.getElementById("contador").innerText = cliques;

/* gráfico */

const ctx = document.getElementById('grafico');

new Chart(ctx, {

type: 'doughnut',

data: {

labels: [

"Usuários que clicaram",

"Usuários que não clicaram"

],

datasets: [{

data: [

cliques,
150 - cliques

]

}]

}

});

</script>

</body>
</html>
