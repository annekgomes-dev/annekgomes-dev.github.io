<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard da Campanha LGPD</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family: "Segoe UI", Arial, sans-serif;
background:#f4f6fa;
margin:0;
padding:20px;
}

.container{
max-width:1000px;
margin:auto;
}

/* HEADER */

.header{
text-align:center;
margin-bottom:30px;
}

.header h1{
color:#0b3d91;
margin-bottom:10px;
}

.header p{
color:#555;
}

/* CARDS */

.grid{
display:grid;
grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:#fff;
padding:25px;
border-radius:10px;
box-shadow:0 8px 20px rgba(0,0,0,0.08);
text-align:center;
}

.card h2{
font-size:16px;
color:#777;
margin-bottom:10px;
}

.metric{
font-size:36px;
font-weight:bold;
color:#b71c1c;
}

/* GRÁFICO */

.chart-container{
background:#fff;
padding:25px;
border-radius:10px;
box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

/* ALERTA */

.alert{
margin-top:30px;
padding:20px;
background:#fff8e1;
border-left:6px solid #ff6f00;
border-radius:8px;
color:#b71c1c;
font-weight:bold;
}

/* FOOTER */

.footer{
text-align:center;
margin-top:30px;
color:#666;
font-size:14px;
}

</style>

</head>

<body>

<div class="container">

<!-- HEADER -->

<div class="header">
<h1>📊 Dashboard da Campanha</h1>
<p>Simulação de Engenharia Social | LGPD | Segurança da Informação</p>
</div>

<!-- MÉTRICAS -->

<div class="grid">

<div class="card">
<h2>Total de Cliques</h2>
<div class="metric" id="contador">Carregando...</div>
</div>

<div class="card">
<h2>Taxa de Risco</h2>
<div class="metric" id="taxa">--%</div>
</div>

<div class="card">
<h2>Total de Usuários</h2>
<div class="metric" id="total">2857</div>
</div>

</div>

<!-- GRÁFICO -->

<div class="chart-container">
<canvas id="grafico"></canvas>
</div>

<!-- ALERTA -->

<div class="alert" id="alerta">
Analisando comportamento dos usuários...
</div>

<!-- FOOTER -->

<div class="footer">
🔐 Campanha de Conscientização | Segurança da Informação | Flex Industries
</div>

</div>

<script>

// 🔐 CONFIG JSONBIN
const BIN_ID = "69b9afa1c3097a1dd533ffe5";
const API_KEY = "$2a$10$zmmaQdVIqMxJEn8asEKOf.fk0Rtygcx.lrV45Lrw92kRUQccI88Y2";

// 👥 TOTAL DE USUÁRIOS
const totalUsuarios = 150;

// 📊 FUNÇÃO PRINCIPAL
async function carregarDashboard(){

try{

let response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
headers: { "X-Master-Key": API_KEY }
});

let data = await response.json();

let cliques = data.record.cliques || 0;

// MÉTRICAS
document.getElementById("contador").innerText = cliques;

// TAXA
let taxa = ((cliques / totalUsuarios) * 100).toFixed(1);
document.getElementById("taxa").innerText = taxa + "%";

// GRÁFICO
let naoClicaram = totalUsuarios - cliques;

const ctx = document.getElementById("grafico");

// evita duplicar gráfico
if(window.graficoInstance){
window.graficoInstance.destroy();
}

window.graficoInstance = new Chart(ctx, {
type: 'doughnut',
data: {
labels: ["Clicaram","Não clicaram"],
datasets: [{
data: [cliques, naoClicaram]
}]
}
});

// ALERTA
let alertaTexto = "";

if(taxa < 10){
alertaTexto = "🟢 Baixo risco: usuários com bom nível de conscientização.";
}else if(taxa < 30){
alertaTexto = "🟡 Atenção: há vulnerabilidade moderada a phishing.";
}else{
alertaTexto = "🔴 Alto risco: usuários suscetíveis a ataques de engenharia social.";
}

document.getElementById("alerta").innerText = alertaTexto;

}catch(error){

console.error(error);
document.getElementById("contador").innerText = "Erro ao carregar";

}

}

// 🔄 ATUALIZA AUTOMÁTICO
setInterval(carregarDashboard, 5000);

// 🚀 PRIMEIRA EXECUÇÃO
carregarDashboard();

</script>

</body>
</html>
